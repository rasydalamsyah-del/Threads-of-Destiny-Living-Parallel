name: Build APK

# Jalan otomatis setiap ada perubahan di branch main,
# atau manual dari tab Actions -> Build APK -> Run workflow.
on:
  push:
    branches: [ main ]
    # Perubahan dokumen saja tidak perlu membuat APK baru
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Cek naskah & data
        run: python3 tools/cek_naskah.py

      - name: Siapkan Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Uji logika game (unit test)
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew testDebugUnitTest --console=plain 2>&1 | tee test.log || {
            # Error kompilasi & tes yang gagal ditampilkan sebagai anotasi agar mudah dibaca
            grep -E "^e: |What went wrong" -A2 test.log | head -30 | while IFS= read -r line; do echo "::error::${line}"; done
            python3 tools/laporan_tes.py app/build/test-results/testDebugUnitTest || true
            exit 1
          }
          python3 tools/laporan_tes.py app/build/test-results/testDebugUnitTest --ringkas || true

      - name: Build APK
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee build.log || {
            # Tampilkan error kompilasi sebagai anotasi agar mudah dibaca
            grep -E "^e: |error:|ERROR:|What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - name: Beri nama APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NAME="ThreadsOfDestiny-v${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Simpan APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      # APK terbaru juga dipasang di halaman Releases -> "latest-build",
      # supaya bisa langsung diunduh dari HP tanpa file zip.
      - name: Perbarui rilis "latest-build"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --cleanup-tag --yes || true
          # Beri jeda agar penghapusan tag lama selesai diproses GitHub
          sleep 5
          gh release create latest-build "${{ steps.apk.outputs.name }}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Build terbaru (v${{ steps.apk.outputs.version }} · build ${GITHUB_RUN_NUMBER})" \
            --notes "APK otomatis dari commit ${GITHUB_SHA::7}. Unduh file .apk di bawah, lalu install di HP Android."
          # Pastikan rilis tidak tertinggal sebagai draft (draft tidak terlihat di halaman rilis)
          for i in 1 2 3; do
            if [ "$(gh release view latest-build --json isDraft -q .isDraft)" = "false" ]; then break; fi
            gh release edit latest-build --draft=false --prerelease || true
            sleep 3
          done
          gh release view latest-build --json isDraft,tagName,assets -q '"draft=\(.isDraft) tag=\(.tagName) aset=\(.assets|length)"'
